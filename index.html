<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新竹物流 運費速算與帳務紀錄器</title>
    <style>
        :root {
            --primary: #f36f21;
            --primary-dark: #d85c13;
            --bg-dark: #121824;
            --card-bg: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); padding: 12px; max-width: 600px; margin: 0 auto; }
        .header { background: linear-gradient(135deg, var(--primary), #e65c00); padding: 16px; border-radius: 12px; text-align: center; margin-bottom: 15px; box-shadow: 0 4px 12px rgba(243,111,33,0.3); }
        .header h1 { font-size: 20px; color: #fff; margin-bottom: 4px; }
        .header p { font-size: 12px; color: rgba(255,255,255,0.9); }
        .config-box { background: var(--card-bg); border: 1px solid var(--border-color); padding: 12px; border-radius: 10px; margin-bottom: 15px; }
        .config-box summary { font-size: 13px; color: var(--primary); cursor: pointer; font-weight: bold; }
        .config-box input { width: 100%; padding: 8px; margin-top: 8px; background: #0f172a; border: 1px solid var(--border-color); color: #fff; border-radius: 6px; font-size: 12px; }
        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
        .card-title { font-size: 14px; color: var(--primary); font-weight: bold; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
        .form-group { margin-bottom: 10px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        label { display: block; font-size: 12px; color: var(--text-sub); margin-bottom: 4px; }
        input[type="text"], input[type="datetime-local"], select { width: 100%; padding: 10px; background: #0f172a; border: 1px solid var(--border-color); color: var(--text-main); border-radius: 8px; font-size: 14px; }
        .calc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .input-with-unit { position: relative; }
        .input-with-unit input { width: 100%; padding-right: 35px; }
        .input-with-unit span { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 12px; color: var(--text-sub); }
        .stepper { display: flex; align-items: center; background: #0f172a; border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; }
        .stepper button { width: 40px; background: #334155; color: #fff; border: none; font-size: 16px; padding: 10px; cursor: pointer; }
        .stepper button:active { background: var(--primary); }
        .stepper input { text-align: center; border: none; background: transparent; color: #fff; width: 100%; font-size: 14px; }
        .checkbox-group { display: grid; grid-template-columns: 1fr; gap: 8px; }
        .checkbox-label { display: flex; align-items: center; background: #0f172a; border: 1px solid var(--border-color); padding: 10px; border-radius: 8px; cursor: pointer; font-size: 13px; }
        .checkbox-label input { width: 18px; height: 18px; margin-right: 8px; accent-color: var(--primary); }
        .checkbox-label span { margin-left: auto; color: var(--primary); font-weight: bold; }
        .result-box { background: linear-gradient(135deg, #1e293b, #0f172a); border: 2px solid var(--primary); border-radius: 12px; padding: 14px; margin-top: 15px; }
        .result-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; }
        .result-total { border-top: 1px dashed var(--border-color); padding-top: 10px; margin-top: 10px; font-size: 18px; font-weight: bold; color: var(--primary); }
        .profit-pos { color: #22c55e; font-weight: bold; }
        .profit-neg { color: #ef4444; font-weight: bold; }
        .btn-submit { width: 100%; background: linear-gradient(135deg, #22c55e, #16a34a); color: white; border: none; padding: 14px; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; box-shadow: 0 4px 12px rgba(34,197,94,0.3); }
        .btn-submit:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <div class="header">
        <h1>新竹物流 運費帳務管理</h1>
        <p>107/08/01 費率與 Google Sheet 試算表同步版</p>
    </div>

    <!-- Apps Script 網址設定 -->
    <details class="config-box">
        <summary>⚙️ 設定 Google Sheet 串接網址</summary>
        <input type="text" id="scriptUrl" placeholder="請貼上 Apps Script 網頁應用程式網址 (/exec)...">
    </details>

    <!-- 帳務與客戶區 -->
    <div class="card">
        <div class="card-title">👤 客戶報價與帳務紀錄資訊</div>
        <div class="form-row">
            <div class="form-group">
                <label>1. 日期時間 (自動/可更動)</label>
                <input type="datetime-local" id="dateTime">
            </div>
            <div class="form-group">
                <label>2. 客戶名稱 / 暱稱</label>
                <input type="text" id="customerName" placeholder="例：牧牧貓砂">
            </div>
        </div>
        <div class="form-row" style="margin-top: 8px;">
            <div class="form-group">
                <label>3. 實收運費 (實際向客戶收)</label>
                <input type="text" id="actualFee" placeholder="輸入實際收費" oninput="calculate()">
            </div>
            <div class="form-group">
                <label>4. 多收 / (少收) 損益差額</label>
                <div id="diffFeeDisplay" style="padding: 10px; background: #0f172a; border-radius: 8px; font-weight: bold; font-size: 14px; text-align: center;">$0</div>
            </div>
        </div>
    </div>

    <!-- 起訖點 -->
    <div class="card">
        <div class="card-title">📍 起終點營業所選擇</div>
        <div class="form-row">
            <div class="form-group">
                <label>寄件營業所 (起點)</label>
                <select id="origin" onchange="calculate()">
                    <option value="南崁" selected>南崁</option>
                    <option value="基隆">基隆</option>
                    <option value="台北">台北</option>
                    <option value="桃園">桃園</option>
                    <option value="中壢">中壢</option>
                    <option value="新竹">新竹</option>
                    <option value="竹南">竹南</option>
                    <option value="苗栗">苗栗</option>
                    <option value="大甲">大甲</option>
                    <option value="台中">台中</option>
                    <option value="沙鹿">沙鹿</option>
                    <option value="豐原">豐原</option>
                    <option value="南投">南投</option>
                    <option value="埔里">埔里</option>
                    <option value="彰化">彰化</option>
                    <option value="員林">員林</option>
                    <option value="斗六">斗六</option>
                    <option value="嘉義">嘉義</option>
                    <option value="新營">新營</option>
                    <option value="麻豆">麻豆</option>
                    <option value="台南">台南</option>
                    <option value="岡山">岡山</option>
                    <option value="高雄">高雄</option>
                    <option value="屏東">屏東</option>
                    <option value="花蓮">花蓮</option>
                    <option value="台東">台東</option>
                </select>
            </div>
            <div class="form-group">
                <label>收件營業所 (終點)</label>
                <select id="dest" onchange="calculate()">
                    <option value="南崁" selected>南崁</option>
                    <option value="基隆">基隆</option>
                    <option value="台北">台北</option>
                    <option value="桃園">桃園</option>
                    <option value="中壢">中壢</option>
                    <option value="新竹">新竹</option>
                    <option value="竹南">竹南</option>
                    <option value="苗栗">苗栗</option>
                    <option value="大甲">大甲</option>
                    <option value="台中">台中</option>
                    <option value="沙鹿">沙鹿</option>
                    <option value="豐原">豐原</option>
                    <option value="南投">南投</option>
                    <option value="埔里">埔里</option>
                    <option value="彰化">彰化</option>
                    <option value="員林">員林</option>
                    <option value="斗六">斗六</option>
                    <option value="嘉義">嘉義</option>
                    <option value="新營">新營</option>
                    <option value="麻豆">麻豆</option>
                    <option value="台南">台南</option>
                    <option value="岡山">岡山</option>
                    <option value="高雄">高雄</option>
                    <option value="屏東">屏東</option>
                    <option value="花蓮">花蓮</option>
                    <option value="台東">台東</option>
                </select>
            </div>
        </div>
    </div>

    <!-- 貨物規格 -->
    <div class="card">
        <div class="card-title">📦 貨物規格與數量</div>
        <div class="calc-grid">
            <div class="form-group input-with-unit">
                <label>單件實際重量 (kg)</label>
                <input type="number" id="weight" value="10" oninput="calculate()">
                <span>kg</span>
            </div>
            <div class="form-group input-with-unit">
                <label>單件才數 (1才 = 10kg)</label>
                <input type="number" id="cai" value="1" oninput="calculate()">
                <span>才</span>
            </div>
        </div>
        <div class="form-group" style="margin-top: 10px;">
            <label>同規格總件數</label>
            <div class="stepper">
                <button type="button" onclick="adjustPieces(-1)">-</button>
                <input type="number" id="pieces" value="1" oninput="calculate()">
                <button type="button" onclick="adjustPieces(1)">+</button>
            </div>
        </div>
    </div>

    <!-- 附加服務 -->
    <div class="card">
        <div class="card-title">📋 附加服務與特殊費用</div>
        <div class="checkbox-group">
            <label class="checkbox-label">
                <input type="checkbox" id="jie" onchange="calculate()" checked> 派單收件 (接費) <span id="jiePrice">$37</span>
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="song" onchange="calculate()" checked> 派送 (送費) <span id="songPrice">$37</span>
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="te" onchange="calculate()"> 特殊服務費 (樓層/地下室) <span id="tePrice">$60</span>
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="tiao" onchange="calculate()"> 挑挽工資 <span id="tiaoPrice">$50</span>
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="lian" onchange="calculate()"> 聯運費 <span id="lianPrice">$100</span>
            </label>
        </div>
    </div>

    <!-- 計算結果 -->
    <div class="result-box">
        <div class="result-row"><span>計費公式說明：</span><span id="formulaDesc" style="font-size: 11px; color: var(--text-sub);"></span></div>
        <div class="result-row"><span>接費：</span><span id="resJie">$37</span></div>
        <div class="result-row"><span>本段運費 (基本)：</span><span id="resBase">$65</span></div>
        <div class="result-row"><span>送費：</span><span id="resSong">$37</span></div>
        <div class="result-row"><span>特殊服務費：</span><span id="resTe">$0</span></div>
        <div class="result-total flex-row">
            <span>系統估算總運費</span>
            <span id="resTotal">$139</span>
        </div>
    </div>

    <button class="btn-submit" onclick="saveToGoogleSheet()">💾 儲存帳務紀錄至 Google 試算表</button>

        function calculate() {

            let dest = document.getElementById('dest').value;

            let cai = parseFloat(document.getElementById('cai').value) || 0;

                let blocks = Math.ceil(extraKg / 10);

            let songFee = isSong ? 37 * pieces : 0;

                let diff = actualFeeVal - totalSystemFee;
                if(diff > 0) {
                    diffDisplay.innerHTML = `<span class="profit-pos">+$${diff} (多收)</span>`;
                } else if(diff < 0) {
                    diffDisplay.innerHTML = `<span class="profit-neg">($${Math.abs(diff)}) (少收)</span>`;
                } else {
                    diffDisplay.innerHTML = `$0 (相符)`;
                }
            } else {
                diffDisplay.innerHTML = `$0`;
            }
        }

        function saveToGoogleSheet() {
            let url = document.getElementById('scriptUrl').value.trim();
            if(!url) {
                alert('請先在上方「設定 Google Sheet 串接網址」填入 Apps Script 網址！');
                return;
            }
            
            localStorage.setItem('hct_script_url', url);

            let payload = {
                dateTime: document.getElementById('dateTime').value,
                customer: document.getElementById('customerName').value || '散客',
                origin: document.getElementById('origin').value,
                dest: document.getElementById('dest').value,
                weight: document.getElementById('weight').value,
                cai: document.getElementById('cai').value,
                pieces: document.getElementById('pieces').value,
                systemFee: document.getElementById('resTotal').innerText.replace('$', ''),
                actualFee: document.getElementById('actualFee').value || document.getElementById('resTotal').innerText.replace('$', ''),
                diffFee: document.getElementById('diffFeeDisplay').innerText,
                jieFee: document.getElementById('jie').checked ? document.getElementById('resJie').innerText.replace('$', '') : '0',
                songFee: document.getElementById('song').checked ? document.getElementById('resSong').innerText.replace('$', '') : '0',
                teFee: document.getElementById('te').checked ? document.getElementById('resTe').innerText.replace('$', '') : '0',
                tiaoFee: document.getElementById('tiao').checked ? '50' : '0',
                lianFee: document.getElementById('lian').checked ? '100' : '0'
            };

            const btn = document.querySelector('.btn-submit');
            btn.innerText = '⏳ 正在儲存至 Google 試算表...';
            
            fetch(url, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(() => {
                alert('🎉 成功！紀錄已成功透過 POST 傳送至 Google 試算表！');
                btn.innerText = '💾 儲存帳務紀錄至 Google 試算表';
            })
            .catch(err => {
                alert('❌ 傳送發生錯誤。');
                btn.innerText = '💾 儲存帳務紀錄至 Google 試算表';
            });
        }
    </script>
</body>
</html>
